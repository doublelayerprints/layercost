name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run build
      - run: npx playwright test
        env:
          CI: true
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start local Supabase
        run: npx supabase start
      - name: Run pgTAP/RLS tests
        run: npm run db:test
      - name: Install Playwright Chromium and psql
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Auth E2E
        run: npm run test:e2e:auth
      - name: Sync E2E
        run: npm run test:e2e:sync
      - name: Stop local Supabase
        if: always()
        run: npx supabase stop --no-backup
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-test-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
