name: Visual baselines

on:
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Plain build, exactly like the CI e2e job: no feedback endpoint, so the
      # suggestions form renders the same state the comparison will see.
      - name: Build with plain environment
        run: npm run build
      - name: Standard visual baselines
        run: npx playwright test tests/e2e/visual.spec.ts --update-snapshots
        env:
          CI: true
      - name: Start local Supabase
        run: |
          npx supabase start
          npx supabase db reset
          npx supabase status -o env | grep -E '^(API_URL|PUBLISHABLE_KEY|ANON_KEY|SERVICE_ROLE_KEY|DB_URL)=' | while IFS= read -r line; do
            key="${line%%=*}"
            value="${line#*=}"
            value="${value%\"}"
            value="${value#\"}"
            case "$key" in
              API_URL) echo "SUPABASE_URL=$value" ;;
              PUBLISHABLE_KEY|ANON_KEY) echo "SUPABASE_PUBLISHABLE_KEY=$value" ;;
              SERVICE_ROLE_KEY) echo "SUPABASE_SERVICE_ROLE_KEY=$value" ;;
              DB_URL) echo "SUPABASE_DB_URL=$value" ;;
            esac
          done >> "$GITHUB_ENV"
      - name: Install psql
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Build with local Supabase
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ env.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ env.SUPABASE_PUBLISHABLE_KEY }}
      - name: Cloud visual baselines
        run: npx playwright test tests/e2e/visual-cloud.spec.ts --update-snapshots
        env:
          CI: true
          E2E_SYNC: '1'
          SUPABASE_URL: ${{ env.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_DB_URL: ${{ env.SUPABASE_DB_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: visual-baselines
          path: tests/e2e/visual.spec.ts-snapshots/
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: visual-cloud-baselines
          path: tests/e2e/visual-cloud.spec.ts-snapshots/
          retention-days: 7
          if-no-files-found: error
