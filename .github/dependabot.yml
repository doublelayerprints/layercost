version: 2

updates:
  # Runtime and tooling dependencies. Weekly, grouped so a normal week opens a
  # single pull request instead of a dozen.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Rome
    open-pull-requests-limit: 5
    groups:
      production:
        dependency-type: production
        update-types: [minor, patch]
      development:
        dependency-type: development
        update-types: [minor, patch]
    commit-message:
      prefix: chore
      include: scope
    labels:
      - dependencies

  # Keep the Actions used by CI, backup and keep-alive workflows current:
  # a pinned action with a known flaw is a supply-chain risk.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
      include: scope
    labels:
      - dependencies